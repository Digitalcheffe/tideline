# Try Tideline on this computer with Docker.
#
#   docker compose -f deploy/compose.local.yaml up -d --build
#
# Then open http://localhost:8080. An empty app asks you to create the first account, then to set up the authenticator app.
# Nothing is reachable from other computers: the port is bound to this machine only.
# Stop with `docker compose -f deploy/compose.local.yaml down` (your data stays); add `-v` to delete the data as well.
#
# The data lives in named Docker volumes here, not bind mounts: SQLite does not behave well on a Windows folder mounted into
# a Linux container. On a server you would use bind mounts to folders you choose instead.
name: tideline

services:
  tideline_app:
    image: tideline:local
    container_name: tideline_app
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      Tideline__PublicUrl: http://localhost:8080
      # behind a reverse proxy, put its address (or range) here, via TIDELINE_TRUSTED_PROXIES in deploy/.env, so the real visitor is known
      Tideline__TrustedProxies: ${TIDELINE_TRUSTED_PROXIES:-}
      Tideline__Timezone: America/New_York
      TZ: America/New_York
      Notify__Enabled: "true"
      SimpleFin__Enabled: "false"
      Tideline__InboxPath: /inbox
    env_file:
      - path: .env
        required: false
    volumes:
      - tideline_data:/data
      - tideline_backups:/backups
      # the CSV inbox: drop a bank export here and the app imports it. Set TIDELINE_INBOX (in deploy/.env) to a folder or a
      # mapped network share on this computer to use a real one; otherwise it is an empty Docker volume.
      - ${TIDELINE_INBOX:-tideline_inbox}:/inbox
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

volumes:
  tideline_data:
  tideline_backups:
  tideline_inbox:
