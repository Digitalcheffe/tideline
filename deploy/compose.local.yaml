# Try Tideline on this computer with Docker (the real server stack comes later, once the Docker host and network are chosen).
#
#   docker compose -f deploy/compose.local.yaml up -d --build
#   docker exec tideline_app tideline user add --email you@example.com --name You --role owner
#   (open the setup link it prints, choose a password, set up the authenticator app)
#
# Open http://localhost:8080. Nothing is reachable from other computers: the port is bound to this machine only.
# Stop with `docker compose -f deploy/compose.local.yaml down` (your data stays); add `-v` to delete the data as well.
#
# The data lives in named Docker volumes here, not bind mounts: SQLite does not behave well on a Windows folder mounted into
# a Linux container. The server stack uses bind mounts under /srv/tideline/ (docs/11-deploy.md).
name: tideline

services:
  tideline_app:
    image: tideline:local
    container_name: tideline_app
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      Tideline__PublicUrl: http://localhost:8080
      Tideline__Timezone: America/New_York
      TZ: America/New_York
      Notify__Enabled: "true"
      SimpleFin__Enabled: "false"
      Tideline__InboxPath: /inbox
    env_file:
      - path: .env
        required: false
    volumes:
      - tideline_data:/data
      - tideline_backups:/backups
      # the CSV inbox: drop a bank export here and the app imports it. Set TIDELINE_INBOX (in deploy/.env) to a folder or a
      # mapped network share on this computer to use a real one; otherwise it is an empty Docker volume.
      - ${TIDELINE_INBOX:-tideline_inbox}:/inbox
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

volumes:
  tideline_data:
  tideline_backups:
  tideline_inbox:
